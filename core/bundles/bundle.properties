tech.agriculture.nodes.FIEL11.NAME = Rice Farm Bonus
tech.agriculture.nodes.FIEL11.DESC = A rice seed will generate a mountain of rice seed, who likes farms?
tech.agriculture.nodes.FIEL12.NAME = Grape Farm Bonus
tech.agriculture.nodes.FIEL12.DESC = More grapes but for what? Wine perhaps?

tech.architecture.nodes.BASE4.NAME = Paved road variant
tech.architecture.nodes.BASE4.DESC = Artfully cut stone lines the streets and plazas of your city. The breathtaking expense is a sign of the city's power. %r%%r% (A paved road will improve but the rain will run off more easily. Who doesn't like jumping from cobblestone to cobblestone, just ask the kids. More durable and faster than classic paved roads.)",

tech.civic.nodes.HORS0.NAME = Horse Logistics
tech.civic.nodes.HORS0.DESC = Your faster and stronger horses help in the transport of resources which allows a better delivery.
tech.civic.nodes.KITC0.NAME = Kitchen
tech.civic.nodes.KITC0.DESC = Unlock the kitchen so that your subjects can prepare a good meal!
tech.civic.nodes.KITC1.NAME = Kitchen Bonus
tech.civic.nodes.KITC1.DESC = Better knife sharpening, more speed and agility for your chefs!
tech.civic.nodes.KITC2.NAME = Filleted fish
tech.civic.nodes.KITC2.DESC = Allows to prepare the fish and to recover its flesh.
tech.civic.nodes.KITC3.NAME = Sushi
tech.civic.nodes.KITC3.DESC = Who doesn't like sushi should not unlock this technique!
tech.civic.nodes.WATER0.NAME = Water
tech.civic.nodes.WATER0.DESC = Allows you to collect water from the river.
tech.civic.nodes.WATER1.NAME = Water Bonus
tech.civic.nodes.WATER1.DESC = Increases the output of your harvester.

tech.crafting.nodes.ARM0.NAME = Armorer
tech.crafting.nodes.ARM0.DESC = With the new advances your engineers and researchers are making. %r%%r% You can now manipulate metals and give them new, more advanced shapes. New, smaller, more precise parts.
tech.crafting.nodes.ARM1.NAME = Weapon Specialization
tech.crafting.nodes.ARM1.DESC = Smithing is equally science, art, and pure physical prowess. Teach your smiths more advanced techniques to improve not only their production speed but also efficiency with goods.
tech.crafting.nodes.BOWY2.NAME = Crossbow
tech.crafting.nodes.BOWY2.DESC =The crossbow is made of an elegant bentwood and carefully crafted arrows for maximum accuracy and distance. No one wants to fight on the front line, but a crossbow allows them to do more damage at range than a bow!
tech.crafting.nodes.CARP4.NAME = Makeshift Weapons
tech.crafting.nodes.CARP4.DESC = Cudgels, wooden spears, and stone hammers aren't very terrifying... but they're better than nothing.
tech.crafting.nodes.CARP5.NAME = Shield
tech.crafting.nodes.CARP5.DESC = A shield is a simple but effective tool for defense. It can be used to block incoming attacks, and even bash enemies back.
tech.crafting.nodes.JEWE2.NAME = Jewelry Craft
tech.crafting.nodes.JEWE2.DESC = Jewelry is a sign of wealth and power. Teach your citizens how to craft it, and they will be able to sell it for a high price.
tech.crafting.nodes.MASO2.NAME = Sandstone Brick
tech.crafting.nodes.MASO2.DESC = Teach your masons techniques for producing Sandstone Brick from sand.

tech.mining.nodes.GOLD0.NAME = Gold Mine
tech.mining.nodes.GOLD0.DESC = Your subjects will be able to collect gold ore to make something extraordinary!
tech.mining.nodes.GOLD1.NAME = Gold Mine Bonus
tech.mining.nodes.GOLD1.DESC = Better prospecting skills and particularly search methods of workers can kick up your gold mine production.
tech.mining.nodes.SAND0.NAME = Sandpit
tech.mining.nodes.SAND0.DESC = Who doesn't like playing in the sand? Your subjects will be able to collect sand to make something extraordinary!
tech.mining.nodes.SAND1.NAME = Sandpit Bonus
tech.mining.nodes.SAND1.DESC = Better prospecting skills and particularly search methods of workers can kick up your sandpit production.

tech.refining.nodes.GLAS0.NAME = Glassmaker
tech.refining.nodes.GLAS0.DESC = The creation of glass requires the hand of an expert.
tech.refining.nodes.GLAS1.NAME = Glassmaker Bonus
tech.refining.nodes.GLAS1.DESC = Precisely controlled temperatures and better processing of ores can improve output of the Smelteries.
tech.refining.nodes.SMEL5.NAME = Secrets of the Gold
tech.refining.nodes.SMEL5.DESC = Bellows and advanced machinery pulley systems make your smeltery a marvel of gold production.
tech.refining.nodes.VINIF0.NAME = Vinification
tech.refining.nodes.VINIF0.DESC = From grapes to quality wine!
tech.refining.nodes.VINIF1.NAME = Vinification Bonus

tech.wild.nodes.WILD0.DESC = 让马夫更好地了解如何照顾驯养的马，帮助它们在牧场上更快地繁殖。马是非常有用的动物，但缺点是也非常需要照顾。它们的腿和蹄子需要特别照顾，饮食和锻炼也需要特别照顾。

tech.crafting.nodes.ARM1.NAME = 武器专精
tech.crafting.nodes.ARM1.DESC = 锻造是科学、艺术和纯粹体力的结合。教您的铁匠更先进的技术，不但提高了他们的生产速度，还提高了效率与产品。
